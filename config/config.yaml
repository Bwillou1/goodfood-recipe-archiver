# ============================================================
#  Configuration Goodfood — à adapter si le site change
# ============================================================

goodfood:
  base_url: "https://www.makegoodfood.ca"
  login_url: "https://www.makegoodfood.ca/login"
  orders_url: "https://www.makegoodfood.ca/fr-CA/account/orders"
  recipes_url: "https://www.makegoodfood.ca/fr-CA/recipes"
  timeout_ms: 30000

  login_selectors:
    email:
      - "input[type=email]"
      - "input[name=email]"
      - "input[autocomplete=email]"
    password:
      - "input[type=password]"
      - "input[name=password]"
    submit:
      - "button[type=submit]"
      - "input[type=submit]"
      - "button:has-text('Se connecter')"

  selectors:
    recipe_link: "a[href*='/recipe/'], a[href*='/product/recipe/']"
    recipe_title: "h1"
    recipe_ingredients: "[class*='ingredient'], [class*='Ingredient']"
    recipe_steps: "[class*='step'], [class*='instruction'], [class*='Step']"
    recipe_image: "img[class*='recipe'], img[class*='hero']"

# Seuil de similarité (0-1) pour matcher un plat de la facture
# à une recette du site. 0.65 = flexible et robuste, 0.85 = strict.
matching:
  threshold: 0.65

# OCR (Tesseract)
ocr:
  lang: "fra"

# Délais entre les requêtes (politesse vis-à-vis du site)
rate_limit:
  delay_seconds: 1.5
