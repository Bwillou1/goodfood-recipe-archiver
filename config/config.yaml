# ============================================================
#  Configuration Goodfood — Optimisée Vitesse & Sécurité
# ============================================================

goodfood:
  base_url: "https://www.makegoodfood.ca"
  login_url: "https://www.makegoodfood.ca/login"
  orders_url: "https://www.makegoodfood.ca/fr-CA/account/orders"
  recipes_url: "https://www.makegoodfood.ca/fr-CA/recipes"
  timeout_ms: 25000

  login_selectors:
    email:
      - "input[type=email]"
      - "input[name=email]"
      - "input[autocomplete=email]"
    password:
      - "input[type=password]"
      - "input[name=password]"
    submit:
      - "button[type=submit]"
      - "input[type=submit]"
      - "button:has-text('Se connecter')"

  selectors:
    recipe_link: "a[href*='/product/recipe/'], a[href*='/recipe/']"
    recipe_title: "h1"
    recipe_ingredients: "[class*='ingredient'], [class*='Ingredient']"
    recipe_steps: "[class*='step'], [class*='instruction'], [class*='Step']"
    recipe_image: "img[class*='recipe'], img[class*='hero']"

# Seuil de similarité (0-1) pour matcher un plat de la facture
# 0.60 = tolérant aux variantes de protéines et titres marketing, 0.80 = strict.
matching:
  threshold: 0.60

# OCR (Tesseract)
ocr:
  lang: "fra"

# Délais optimisés entre les requêtes (en secondes)
rate_limit:
  delay_seconds: 0.8
