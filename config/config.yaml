# ============================================================
#  Configuration Goodfood — Haute Performance & Sécurité
# ============================================================

goodfood:
  base_url: "https://www.makegoodfood.ca"
  login_url: "https://www.makegoodfood.ca/fr-CA?loginModal=email&isNewUser="
  recipe_cards_url: "https://www.makegoodfood.ca/fr-CA/recipe-cards"
  catalog_url: "https://www.makegoodfood.ca/fr-CA/mealkit/recipes"
  card_url_template: "https://www2.makegoodfood.ca/recipe-card/{sku}/{lang}"
  timeout_ms: 25000

  login_selectors:
    email:
      - "[data-testid='email-input-input']"
      - "input[type=email]"
      - "input[name=email]"
      - "input[autocomplete=email]"
    password:
      - "[data-testid='password-input-input']"
      - "input[type=password]"
      - "input[name=password]"
    submit:
      - "[data-testid='login-with-email-cta']"
      - "button[type=submit]"
      - "button:has-text('Se connecter')"
      - "button:has-text('Continuer')"

  auth_probe:
    url: "https://www.makegoodfood.ca/fr-CA/recipe-cards"
    markers:
      - "a[href*='www2.makegoodfood.ca/recipe-card/']"
      - ":text('Bonjour')"
      - ":text('Vos commandes')"

# Rapprochement flou (rapidfuzz)
matching:
  threshold: 0.60
  strict_threshold: 0.85

# Performance & Concurrence
performance:
  parallel: 3
  cache_ttl_hours: 24

# Langue par défaut des fiches
lang: "fr"

# OCR (Tesseract)
ocr:
  lang: "fra"

# Délai de politesse configurable (en secondes)
rate_limit:
  delay_seconds: 0.3
